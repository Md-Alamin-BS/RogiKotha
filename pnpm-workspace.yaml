packages:
  - 'apps/*'
  - 'packages/*'

# ISS-055: without this, every fresh install/worktree stops on
# ERR_PNPM_IGNORED_BUILDS and needs a manual `pnpm approve-builds --all`.
# Both are native-build install/postinstall scripts from pnpm's own
# dependency tree (file-watching and SWC transpilation), not arbitrary
# third-party postinstall code — safe to pre-approve once, for good.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  # ISS-106: drizzle-kit (T-004) pulls in esbuild, whose install script is
  # gated the same way. Same reasoning as the two above: it is a native
  # build step from a pinned build tool, not third-party postinstall code.
  esbuild: true
