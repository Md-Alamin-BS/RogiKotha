<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>RogiKotha — Quiet Clinic (minimal)</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-view="discover">

<!-- STORY-PLAT-001: synchronous lang set from localStorage -->
<script>
(function(){
  try {
    var l = localStorage.getItem('rk04.lang');
    if (l === 'en' || l === 'bn') {
      document.documentElement.setAttribute('lang', l);
      document.documentElement.setAttribute('data-lang', l);
    }
  } catch (e) {}
})();
</script>


<a class="skip" href="#main" data-i18n="a11y.skip">Skip to main content</a>

<p class="demo" role="note"><span data-i18n="demo.banner"></span></p>

<header class="masthead">
  <a class="brand" href="#discover">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-text">
      <b data-i18n="brand.name"></b>
      <i data-i18n="brand.tagline"></i>
    </span>
  </a>

  <nav class="tabs" aria-label="Screens">
    <a href="#discover"  data-nav="discover"  data-i18n="nav.discover"></a>
    <a href="#results"   data-nav="results"   data-i18n="nav.results"></a>
    <a href="#profile"   data-nav="profile"   data-i18n="nav.profile"></a>
    <a href="#account"   data-nav="account"   data-i18n="nav.account"></a>
    <a href="#condition" data-nav="condition" data-i18n="nav.condition"></a>
    <a href="#facility"  data-nav="facility"  data-i18n="nav.facility"></a>
    <a href="#compose"   data-nav="compose"   data-i18n="nav.compose"></a>
    <a href="#mine"      data-nav="mine"      data-i18n="nav.mine"></a>
  </nav>

  <div class="controls">
    <button type="button" id="lang"   class="ctl" data-i18n="a11y.lang"   data-i18n-attr="title" aria-pressed="false"><span>অ</span></button>
    <button type="button" id="theme"  class="ctl" data-i18n="a11y.theme"  data-i18n-attr="title"><span>◐</span></button>
    <button type="button" id="motion" class="ctl" data-i18n="a11y.motion" data-i18n-attr="title" aria-pressed="false"><span>◌</span></button>
    <!-- STORY-PROT-001: role + reset demo controls -->
    <button type="button" id="demo" class="ctl" title="Demo controls"><span>◇</span></button>
    <a class="ctl" href="../../index.html" data-i18n="concept.back" data-i18n-attr="title"><span>⌘</span></a>
  </div>

  <!-- STORY-PROT-001: demo controls panel (hidden until activated) -->
  <div id="demo-panel" class="panel" hidden style="position:fixed;top:64px;right:16px;z-index:60;width:280px;padding:16px 18px">
    <h4 class="sub-head" style="border-top:0;padding-top:0;margin:0 0 10px">Demo controls</h4>
    <p class="note" style="margin:0 0 10px">Simulated role gates what you see. Production would sign in with confirmed email + identity check.</p>
    <div class="opt-row" style="margin-bottom:14px">
      <button class="opt" type="button" data-role="reader" aria-pressed="true">Reader</button>
      <button class="opt" type="button" data-role="contributor" aria-pressed="false">Contributor</button>
      <button class="opt" type="button" data-role="moderator" aria-pressed="false">Moderator</button>
    </div>
    <button class="btn small" type="button" id="demo-reset">Reset demo</button>
    <button class="link-btn" type="button" id="demo-close" style="margin-left:8px">Close</button>
  </div>
</header>

<div class="progress" aria-hidden="true"><i></i></div>

<main id="main">
  <!-- STORY-NFR-006: aria-live for dynamic regions -->
  <div id="sr-live" class="sr-only" aria-live="polite" role="status"></div>
  <section class="view" id="view-discover"></section>
  <section class="view" id="view-results"   hidden></section>
  <section class="view" id="view-profile"   hidden></section>
  <section class="view" id="view-account"   hidden></section>
  <section class="view" id="view-condition" hidden></section>
  <section class="view" id="view-facility"  hidden></section>
  <section class="view" id="view-compose"   hidden></section>
  <section class="view" id="view-mine"      hidden></section>
  <section class="view" id="view-emergency" hidden></section>
  <section class="view" id="view-about"     hidden></section>
</main>

<!-- compare tray, present on results -->
<div class="tray" id="tray" hidden>
  <div class="tray-inner">
    <span class="tray-label" data-i18n="compare.title"></span>
    <div class="tray-items" id="tray-items"></div>
    <div class="tray-actions">
      <button type="button" class="btn small" id="open-compare" data-i18n="compare.open"></button>
      <button type="button" class="btn small ghost" id="clear-compare" data-i18n="compare.clear"></button>
    </div>
  </div>
</div>

<!-- overlay used by compare, report and appeal -->
<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button type="button" class="sheet-close" id="sheet-close" aria-label="Close">✕</button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<footer class="colophon">
  <nav class="foot-nav" aria-label="Site sections">
    <a href="#emergency" data-i18n="nav.emergency"></a>
    <a href="#about"     data-i18n="nav.about"></a>
  </nav>
  <p data-i18n="disclaimer.long"></p>
  <p class="foot-demo" data-i18n="demo.banner"></p>
</footer>

<script src="../../shared/rogikotha-data.js"></script>
<script src="app.js"></script>
</body>
</html>
