  - {after: TASK-PROT-002-A, tasks: [TASK-PROT-002-B, TASK-PROT-002-C, TASK-PROT-002-D], isolation: separate concept directories; shared files frozen}
  - {after: TASK-AUTH-001-A, tasks: [TASK-AUTH-002-A, TASK-DIR-001-A, TASK-PLAT-001-A], isolation: separate owning modules}
  - {after: TASK-REV-001-A, tasks: [TASK-REV-002-A, TASK-COM-001-A, TASK-NOTIF-001-A], isolation: contracts frozen; no cross-module table writes}
  - {after: stable public projections, tasks: [TASK-SRCH-001-A, TASK-OPS-001-A], isolation: search corpus and infrastructure only}

gate_rules:
  gate_2: all requirement IDs map to existing stories and all task references resolve
  gate_3: frontend brief, three wireframe sets, UX contract, and validation matrix approved
  gate_4: runnable concepts only; no production backend, real auth, real evidence, or real patient data
  gate_5: founder selects a concept or combination before consolidation
