schema_version: 1
project: RogiKotha
status: planned
source_of_truth:
  requirements: docs/planning/06-requirement-traceability-matrix.md
  stories: docs/planning/08-product-backlog.md
  architecture: docs/architecture/ARCHITECTURE-SPINE.md
  assignments: docs/planning/07-agent-model-assignment.md

task_defaults:
  implementation: &implementation
    kind: implementation
    required_inputs: [docs/planning/08-product-backlog.md, docs/planning/05-recommended-architecture.md, docs/planning/10-validation-strategy.md, docs/architecture/ARCHITECTURE-SPINE.md, applicable files in docs/architecture/decisions]
    commands: [pnpm lint, pnpm typecheck, pnpm test]
    acceptance_evidence: [focused diff, command transcript with exit codes, new test results, requirement links]
    validating_model: Claude Code configured Sonnet in a separate session
    human_approval: false
  validation: &validation
    kind: validation
    required_inputs: [implementer diff, implementer test transcript, story acceptance criteria, applicable ADRs]
    commands: [pnpm lint, pnpm typecheck, pnpm test]
    expected_output: PASS, PASS WITH FOLLOW-UP, or FAIL with evidence and residual risk
    acceptance_evidence: [actual diff inspection, independent rerun, negative or edge-case probe]
    implementing_model: independent validator, not the implementation session
    human_approval: false

